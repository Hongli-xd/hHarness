# HistRAG LightRAG Configuration

# Working directory for RAG storage
working_dir: ~/.histrag/rag_storage

# LLM Configuration (Anthropic)
llm:
  model_func: "anthropic"
  model_name: "MiniMax-M2.7"
  api_key: "sk-cp-HT93UTSKgpBYKYbEhTrU2JlSVEFO_6SEXNjQYTYCGZXwhPRCFn9WBt2NEGU9ZIBu7nJqKK3c1oCgBEPH_P7xBM0b9RoedCYi1wq4Q-cUjMYG-gD0NUSH97U"
  base_url: "https://api.minimaxi.com/anthropic"
  max_tokens: 64000
  summary_max_tokens: 50000
  max_async: 3
  timeout: 900

embedding:
  model: Qwen/Qwen3-Embedding-4B
  dimension: 1024
  max_token_size: 8192
  api_key: "sk-9Gmai1GrqiY5up0xiChBspADCuwWbV9k73Eg7Zqj5FBiKpC7"
  base_url: https://api.xiaocaseai.com/v1
  batch_size: 5
  


# Storage Configuration
storage:
  kv_storage: JsonKVStorage
  vector_storage: NanoVectorDBStorage
  graph_storage: Neo4JStorage
  doc_status_storage: JsonDocStatusStorage

# Query Configuration
query:
  top_k: 60
  chunk_top_k: 10
  max_entity_tokens: 6000
  max_relation_tokens: 8000
  max_total_tokens: 30000

# Chunking Configuration
chunking:
  chunk_token_size: 2000
  chunk_overlap_token_size: 150

# Cache Configuration
cache:
  enable_llm_cache: true
  enable_llm_cache_for_entity_extract: true

# Merge Configuration
merge:
  force_llm_summary_on_merge: 17  # 描述数<=16直接拼接，>16调用LLM合并

# Neo4j Configuration
neo4j:
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "00000000"
