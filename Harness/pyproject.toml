[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "histrag"
version = "0.1.0"
description = "HistRAG - Historical Research Agent with 3D Map Visualization"
requires-python = ">=3.11"

dependencies = [
    # Core agent & API
    "anthropic>=0.49.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",

    # Web server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",

    # CDN proxy (for Three.js / GSAP offline caching)
    "httpx>=0.27",

    # RAG / graph
    "lightrag-hku>=1.3",

    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
]

[project.scripts]
histrag = "histrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["histrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]